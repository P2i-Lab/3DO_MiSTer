# Builds the 3DO core RBF with Quartus Prime Lite 17.0.2 (the free edition) on a
# GitHub-hosted runner. Quartus is downloaded from Intel's servers by
# drizzt/quartus-install and kept in this repository's Actions cache: Intel's
# license does not allow redistributing it, so it is never published.
#
# Run it from the Actions tab ("Build RBF" > "Run workflow") with the branch to build.
name: Build RBF

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        required: true
        default: fix/arm6-cpu

permissions:
  contents: read

env:
  QUARTUS_DIR: /opt/intelFPGA_lite/17.0
  QUARTUS_CACHE_KEY: quartus-lite-17.0.2-c5-v1
  QUARTUS_INSTALL_COMMIT: 110b1e7a519193caf6d92a2b4412cf7f85858354

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Check out ${{ inputs.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: core

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install the libraries Quartus 17 needs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends aria2 build-essential zstd locales \
            libglib2.0-0t64 libsm6 libice6 libxext6 libxft2 libxrender1 libxtst6 libxi6 libx11-6 \
            libxcb1 libfontconfig1 libfreetype6 libudev1
          sudo locale-gen en_US.UTF-8

      - name: Restore Quartus from the cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/quartus.tar.zst
          key: ${{ env.QUARTUS_CACHE_KEY }}

      - name: Unpack Quartus
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          sudo tar --zstd -xf "$RUNNER_TEMP/quartus.tar.zst" -C /
          rm -f "$RUNNER_TEMP/quartus.tar.zst"

      - name: Download and install Quartus Prime Lite 17.0.2 (Cyclone V only)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone -q https://github.com/drizzt/quartus-install.git "$RUNNER_TEMP/qi"
          git -C "$RUNNER_TEMP/qi" checkout -q "$QUARTUS_INSTALL_COMMIT"
          sudo mkdir -p "$QUARTUS_DIR"
          sudo chown -R "$(id -u):$(id -g)" "$(dirname "$QUARTUS_DIR")"
          cd "$RUNNER_TEMP"
          python3 "$RUNNER_TEMP/qi/quartus-install.py" --prune --fix-libpng --fix-libncurses 17.0lite "$QUARTUS_DIR" c5
          du -sh "$QUARTUS_DIR"
          tar --zstd -cf "$RUNNER_TEMP/quartus.tar.zst" "$QUARTUS_DIR"

      - name: Save Quartus to the cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/quartus.tar.zst
          key: ${{ env.QUARTUS_CACHE_KEY }}

      - name: Compile
        working-directory: core
        run: |
          # Quartus 17 ships a 2017 libudev that crashes with the glibc of Ubuntu 24.04
          export LD_PRELOAD="$(ls /usr/lib/x86_64-linux-gnu/libudev.so.1 /lib/x86_64-linux-gnu/libudev.so.1 2>/dev/null | head -n 1)"
          "$QUARTUS_DIR/quartus/bin/quartus_sh" --version
          "$QUARTUS_DIR/quartus/bin/quartus_sh" --flow compile 3DO

      - name: Fit and timing summary
        if: always()
        working-directory: core
        run: |
          cat output_files/3DO.fit.summary 2>/dev/null || true
          cat output_files/3DO.sta.summary 2>/dev/null || true

      - name: Upload the RBF
        uses: actions/upload-artifact@v4
        with:
          name: 3DO-${{ github.run_number }}
          path: |
            core/output_files/3DO.rbf
            core/output_files/3DO.fit.summary
            core/output_files/3DO.sta.summary
          if-no-files-found: error
